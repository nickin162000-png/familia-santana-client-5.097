        uses: actions/checkout@v4

      - name: Instalar Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8

      - name: Baixar Forge MDK 1.8.9 (para pegar o gradlew)
        run: |
          curl -fL -o mdk.zip https://maven.minecraftforge.net/net/minecraftforge/forge/1.8.9-11.15.1.2318-1.8.9/forge-1.8.9-11.15.1.2318-1.8.9-mdk.zip
          unzip -q mdk.zip -d mdk
          MD=$(dirname "$(find mdk -name gradlew | head -n 1)")
          cp -r "$MD/gradle" .
          cp "$MD/gradlew" "$MD/gradlew.bat" .
          chmod +x gradlew

      - name: Preparar o Minecraft
        run: ./gradlew setupCIWorkspace --no-daemon

